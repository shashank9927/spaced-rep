name: Security and quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production build validates that public Supabase settings exist even
    # though it does not contact Supabase while it renders private routes.
    # Keep CI self-contained: these are inert build-time placeholders, not
    # deployment credentials.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: npm ci
      - run: supabase db start
      - run: npm run test:db
      - name: Capture database logs
        if: failure()
        run: docker logs supabase_db_recallcode > database.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-diagnostics
          path: database.log
      - if: ${{ always() }}
        run: supabase stop --no-backup

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: npm ci
      - run: supabase start
      - name: Export isolated environment
        shell: bash
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=LOCAL_API_URL \
            --override-name auth.anon_key=LOCAL_ANON_KEY \
            --override-name auth.service_role_key=LOCAL_SERVICE_KEY)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$LOCAL_API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$LOCAL_ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$LOCAL_SERVICE_KEY" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_URL=$LOCAL_API_URL" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_ANON_KEY=$LOCAL_ANON_KEY" >> "$GITHUB_ENV"
          echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$LOCAL_SERVICE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BASE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_EMAIL=owner@recallcode.test" >> "$GITHUB_ENV"
          echo "E2E_REQUIRED=true" >> "$GITHUB_ENV"
      - run: npm run catalog:import
      - run: npm run test:db:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Capture browser database logs
        if: failure()
        run: docker logs supabase_db_recallcode > browser-database.log 2>&1 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-database-diagnostics
          path: browser-database.log
      - if: ${{ always() }}
        run: supabase stop --no-backup
